# QT_STYLE_OVERRIDE=kvantum (set globally in /etc/environment for GTK/Qt
# widget theming) breaks QML components that try to resolve it as a QQC2
# style ("module kvantum is not installed"), which silently kills
# plasmashell's wallpaper/panel rendering.
#
# The env/unset-kvantum-qquick-override.sh script in
# /etc/xdg/plasma-workspace/env/ only unsets it in the shell process that
# sources startplasma's env scripts -- it does NOT reach systemd's user
# manager environment block, which is what plasma-plasmashell.service (a
# systemd user unit) actually inherits from. UnsetEnvironment here is the
# only thing that reliably works.
[Service]
UnsetEnvironment=QT_STYLE_OVERRIDE
