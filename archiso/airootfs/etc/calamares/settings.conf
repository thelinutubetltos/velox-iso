---
instances:
  - id: post
    module: shellprocess
    config: shellprocess-post.conf

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - shellprocess
    - machineid
    - locale
    - keyboard
    - localecfg
    - fstab
    - users
    - shellprocess@post
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - umount
  - show:
    - finished

branding: velox

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
