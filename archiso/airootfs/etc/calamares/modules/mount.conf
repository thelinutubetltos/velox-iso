---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: bind
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache/pacman/pkg
      subvolume: /@pkg

btrfsSwapSubvolume: /@swap

mountOptions:
    - filesystem: btrfs
      options: [ rw, noatime, compress=zstd, space_cache=v2 ]
    - filesystem: ext4
      options: [ rw, relatime ]
    - filesystem: xfs
      options: [ rw, relatime ]
