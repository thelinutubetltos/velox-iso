---
timeout: 300
script:
    - bash /usr/lib/velox-installer/apply-desktop-skel.sh
    - bash /usr/lib/velox-installer/copy-autostart.sh
    - find /home -name "*.desktop" -exec grep -l -i calamares {} \; | xargs rm -f 2>/dev/null || true
    - find /root -name "*.desktop" -exec grep -l -i calamares {} \; | xargs rm -f 2>/dev/null || true
    - bash /usr/lib/velox-installer/cleanup-backgrounds.sh
