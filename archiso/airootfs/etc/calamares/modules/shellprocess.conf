---
timeout: 600
script:
    - rm -f /etc/resolv.conf
    - sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
    - sh -c 'echo "nameserver 1.1.1.1" >> /etc/resolv.conf'
    - bash /usr/lib/velox-installer/install.sh
    - pacman-key --init
    - pacman-key --populate archlinux chaotic
    - pacman -Sy --noconfirm
