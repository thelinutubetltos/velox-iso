---
dontChroot: true
script:
    - mkdir -p /tmp/calamares-root/boot
    - cp /run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux /tmp/calamares-root/boot/vmlinuz-linux
    - cp /run/archiso/bootmnt/arch/boot/x86_64/initramfs-linux.img /tmp/calamares-root/boot/initramfs-linux.img
    - bash -c 'ROOT_PART=$(findmnt -n -o SOURCE /tmp/calamares-root); ROOT_DISK=$(lsblk -no pkname $ROOT_PART); grub-install --target=i386-pc --boot-directory=/tmp/calamares-root/boot /dev/$ROOT_DISK'
    - bash -c 'ROOT_UUID=$(findmnt -n -o UUID /tmp/calamares-root); mkdir -p /tmp/calamares-root/boot/grub; printf "set default=0\nset timeout=5\n\nmenuentry \"Velox Linux\" {\n    search --no-floppy --fs-uuid --set=root %s\n    linux /boot/vmlinuz-linux root=UUID=%s rw quiet splash\n    initrd /boot/initramfs-linux.img\n}\n" $ROOT_UUID $ROOT_UUID > /tmp/calamares-root/boot/grub/grub.cfg'
    - find /tmp/calamares-root/home -name "*.desktop" -exec grep -l -i calamares {} \; | xargs rm -f
    - find /tmp/calamares-root/root -name "*.desktop" -exec grep -l -i calamares {} \; | xargs rm -f
