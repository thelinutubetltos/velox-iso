---
timeout: 300
dontChroot: true
script:
    - bash -c "CHROOT=$(ls -d /tmp/calamares-root-* 2>/dev/null | head -1) && mkdir -p $CHROOT/dev $CHROOT/proc $CHROOT/sys && mount --bind /dev $CHROOT/dev && mount --bind /proc $CHROOT/proc && mount --bind /sys $CHROOT/sys && chroot $CHROOT /usr/lib/velox-installer/install.sh"
    - bash -c "CHROOT=$(ls -d /tmp/calamares-root-* 2>/dev/null | head -1) && find $CHROOT/home -name '*.desktop' -exec grep -l -i calamares {} \; | xargs rm -f 2>/dev/null || true"
    - bash -c "CHROOT=$(ls -d /tmp/calamares-root-* 2>/dev/null | head -1) && find $CHROOT/root -name '*.desktop' -exec grep -l -i calamares {} \; | xargs rm -f 2>/dev/null || true"
