LABEL arch
TEXT HELP
Boot the Velox Linux install medium on BIOS.
It allows you to install Velox or perform system maintenance.
ENDTEXT
MENU LABEL Boot Velox Linux (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-velox
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-velox.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=4G copytoram=n archisosearchuuid=%ARCHISO_UUID% driver=free module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nouveau.modeset=1 radeon.modeset=1 i915.modeset=1 nvme_load=yes

LABEL arch nomodeset
TEXT HELP
Boot Velox Linux on BIOS with safe graphics (nomodeset).
Use this if the display is blank or corrupted on the default boot.
ENDTEXT
MENU LABEL Boot Velox Linux (%ARCH%, BIOS, safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-velox
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-velox.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=4G copytoram=n archisosearchuuid=%ARCHISO_UUID% driver=free nomodeset module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nouveau.modeset=0 radeon.modeset=0 i915.modeset=0 nvme_load=yes
